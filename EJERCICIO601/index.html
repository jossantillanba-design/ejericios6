<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva de Cancha - Ayacucho</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="registro" class="bg-light">
<main class="container py-4">
  <h1 class="mb-3">Solicitud de Reserva de Cancha</h1>
  <p class="text-muted">Complejo Deportivo Barrial - Ayacucho (Simulación)</p>
  
  <form id="reserva" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label for="responsable" class="form-label">Nombre del responsable</label>
      <input id="responsable" name="responsable" class="form-control" required minlength="3" maxlength="70">
    </div>

    <div class="mb-3">
      <label for="celular" class="form-label">Celular de prueba (9 dígitos, inicia con 9)</label>
      <input id="celular" name="celular" class="form-control" inputmode="numeric" pattern="9[0-9]{8}" maxlength="9" required>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label for="fecha" class="form-label">Fecha de reserva</label>
        <input id="fecha" name="fecha" type="date" class="form-control" required>
        <div id="fechaHelp" class="form-text text-muted">No se permiten fechas anteriores a la fecha actual.</div>
      </div>
      <div class="col-md-6">
        <label for="turno" class="form-label">Turno</label>
        <select id="turno" name="turno" class="form-select" required>
          <option value="">Seleccione turno</option>
          <option value="Mañana">Mañana (S/ 40/h)</option>
          <option value="Tarde">Tarde (S/ 50/h)</option>
          <option value="Noche">Noche (S/ 65/h)</option>
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label for="horas" class="form-label">Horas (1 a 3)</label>
      <input id="horas" name="horas" type="number" class="form-control" min="1" max="3" step="1" required>
    </div>

    <fieldset class="mb-3">
      <legend class="fs-6 fw-bold">Implementos opcionales</legend>
      <div class="form-check">
        <input id="balon" type="checkbox" name="implementos" value="Balón" class="form-check-input">
        <label for="balon" class="form-check-label">Balón (+S/ 5.00)</label>
      </div>
      <div class="form-check">
        <input id="chalecos" type="checkbox" name="implementos" value="Chalecos" class="form-check-input">
        <label for="chalecos" class="form-check-label">Chalecos (+S/ 10.00)</label>
      </div>
    </fieldset>

    <button type="submit" class="btn btn-primary">Revisar Reserva</button>
  </form>

  <p id="mensaje" role="status" class="mt-3 text-danger fw-bold"></p>
</main>
</body>
</html>
