<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotización de encomiendas - Arequipa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="script.js" defer></script>
</head>
<body data-pagina="registro" class="bg-light">
  <main class="container py-4">
    <h1>Cotización de encomiendas</h1>
    <p>Simulación educativa. No representa una tarifa comercial vigente ni un comprobante de pago.</p>
    <form id="encomienda" class="card p-3">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="remitente" class="form-label">Remitente</label>
          <input id="remitente" name="remitente" class="form-control" required minlength="3" maxlength="70">
        </div>
        <div class="col-md-6">
          <label for="correo" class="form-label">Correo</label>
          <input id="correo" name="correo" type="email" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label for="destino" class="form-label">Destino</label>
          <select id="destino" name="destino" class="form-select" required>
            <option value="">Selecciona</option>
            <option value="Lima">Lima</option>
            <option value="Cusco">Cusco</option>
            <option value="Puno">Puno</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="peso" class="form-label">Peso (kg, de 0.1 a 30)</label>
          <input id="peso" name="peso" type="number" class="form-control" min="0.1" max="30" step="0.1" required>
        </div>
        <div class="col-md-4">
          <label for="servicio" class="form-label">Servicio</label>
          <select id="servicio" name="servicio" class="form-select" required>
            <option value="">Selecciona</option>
            <option value="estandar">Estándar</option>
            <option value="expres">Exprés</option>
          </select>
        </div>
      </div>
      <fieldset class="my-3">
        <legend class="fs-5">Servicios adicionales</legend>
        <input id="embalaje" name="embalaje" type="checkbox" value="si">
        <label for="embalaje">Embalaje: S/ 5.00</label>
      </fieldset>
      <div>
        <button type="submit" class="btn btn-primary">Revisar cotización</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
      </div>
    </form>
    <p id="mensaje" role="status" class="mt-3"></p>
  </main>
</body>
</html>
